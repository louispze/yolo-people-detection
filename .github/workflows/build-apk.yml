name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Le dossier mobile/android n'est PAS commite : il est genere
# au build par "npx cap add android" puis synchronise par "npx cap sync".

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # nécessaire pour publier l'APK en release

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web app (Vite)
        run: npm run build

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install --no-save @capacitor/cli

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publie l'APK comme release publique "latest" -> URL directe sans auth :
      # https://github.com/<user>/<repo>/releases/download/latest/app-debug.apk
      - name: Publish APK to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Derniere APK (debug)
          prerelease: true
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
